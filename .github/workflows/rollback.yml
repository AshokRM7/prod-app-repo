name: Rollback

on:
  workflow_dispatch:
    inputs:
      backend_revision:
        description: "Backend task definition revision to deploy"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::699061129530:role/production-app-github-actions-deploy-role
          aws-region: ap-south-1

      - name: Roll back backend service
        run: |
          aws ecs update-service \
            --cluster production-app-cluster \
            --service production-app-backend-service \
            --task-definition production-app-backend:${{ inputs.backend_revision }}

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster production-app-cluster \
            --services production-app-backend-service

      - name: Verify backend health
        run: |
          curl --fail --retry 5 --retry-delay 10 \
            http://production-app-alb-1917539745.ap-south-1.elb.amazonaws.com/api/v1/health