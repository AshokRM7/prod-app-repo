name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read



jobs:
  backend-tests:
    runs-on: ubuntu-latest

    env:
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

  deploy:
    needs:
      - backend-tests
      - frontend-build

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::699061129530:role/production-app-github-actions-deploy-role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -t 699061129530.dkr.ecr.ap-south-1.amazonaws.com/production-app-backend:${{ github.sha }} \
            ./backend

      - name: Push backend image
        run: |
          docker push 699061129530.dkr.ecr.ap-south-1.amazonaws.com/production-app-backend:${{ github.sha }}

      - name: Download current backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition production-app-backend \
            --query taskDefinition \
            > backend-task-definition.json

      - name: Render backend task definition
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-definition.json
          container-name: backend
          image: 699061129530.dkr.ecr.ap-south-1.amazonaws.com/production-app-backend:${{ github.sha }}

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
          service: production-app-backend-service
          cluster: production-app-cluster
          wait-for-service-stability: true

      - name: Verify backend health
        run: |
          curl --fail --retry 5 --retry-delay 10 \
            http://production-app-alb-1917539745.ap-south-1.elb.amazonaws.com/api/v1/health


      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            -t 699061129530.dkr.ecr.ap-south-1.amazonaws.com/production-app-frontend:${{ github.sha }} \
            ./frontend

      - name: Push frontend image
        run: |
          docker push 699061129530.dkr.ecr.ap-south-1.amazonaws.com/production-app-frontend:${{ github.sha }}

      - name: Download current frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition production-app-frontend \
            --query taskDefinition \
            > frontend-task-definition.json

      - name: Render frontend task definition
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-definition.json
          container-name: frontend
          image: 699061129530.dkr.ecr.ap-south-1.amazonaws.com/production-app-frontend:${{ github.sha }}

      - name: Deploy frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
          service: production-app-frontend-service
          cluster: production-app-cluster
          wait-for-service-stability: true

      - name: Verify frontend
        run: |
          curl --fail --retry 5 --retry-delay 10 \
            http://production-app-alb-1917539745.ap-south-1.elb.amazonaws.com/