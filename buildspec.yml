version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python --version
      - node --version

  pre_build:
    commands:
      - pip install -r backend/requirements.txt
      - cd frontend && npm ci && cd ..

  build:
    commands:
      - cd backend && python -m pytest -v && cd ..
      - cd frontend && VITE_API_BASE_URL=/api/v1 npm run build && cd ..