version: 0.2

phases:
  install:
    commands:
      - python --version
      - node --version

  pre_build:
    commands:
      - pip install -r backend/requirements.txt
      - cd frontend && npm ci && cd ..

  build:
    commands:
      - python -m pytest backend/tests -v
      - cd frontend && VITE_API_BASE_URL=/api/v1 npm run build && cd ..